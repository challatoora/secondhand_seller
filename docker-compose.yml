services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: secondhand-backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PORT: 5000
      MONGO_URI: mongodb://host.docker.internal:27017/secondhand
    extra_hosts:
      - "host.docker.internal:host-gateway"
  

  frontend:
    build:
      context: .
      dockerfile: Frontend/Dockerfile
    container_name: secondhand-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend